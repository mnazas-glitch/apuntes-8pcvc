<p>Abra esta página desde el enlace de Moodle. Si tiene la llave del curso, escríbala aquí.</p>
<input id="llave" autocomplete="off" aria-label="Llave del curso"><button>Abrir</button><p id="err" class="err" aria-live="polite"></p></form>
<script>
function normLlave(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-');}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function abrirCon(d,llave){
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(normLlave(llave)),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.s),iterations:d.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.iv)},k,b64(d.c)));
  }catch(e){return null;}
}
